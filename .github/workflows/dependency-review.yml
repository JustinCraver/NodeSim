name: Authorized dependency review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    environment: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Clean install from lockfile
        run: npm ci --no-audit
      - name: Current high and critical advisories
        id: audit
        continue-on-error: true
        run: npm run deps:audit
      - name: Current outdated packages
        id: outdated
        continue-on-error: true
        run: npm run deps:outdated
      - name: Installed production and development licenses
        id: licenses
        continue-on-error: true
        run: npm run deps:licenses
      - name: Require every dependency review gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.audit.outcome }}" = "success"
          test "${{ steps.outdated.outcome }}" = "success"
          test "${{ steps.licenses.outcome }}" = "success"
